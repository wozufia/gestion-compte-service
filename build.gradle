plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.5.0'
	id 'maven-publish'
}

repositories {
	mavenCentral()
//	maven {
//		name = "GitHubPackages"
//		url = uri("https://maven.pkg.github.com/wozufia/gestion-compte")
//		credentials {
//			username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
//			password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
//		}
//	}
}

group = 'com.awa.centrale'
version = '0.0.1-SNAPSHOT'
description = 'Outil de gestion des comptes'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/wozufia/gestion-compte")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	// Generateur de Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// H2 base de données en mémoire pour les tests
	runtimeOnly 'com.h2database:h2'

}

def contractSpecFile = layout.buildDirectory.file("tmp/openapi/gestion-compte-contrat.yml")

tasks.register('fetchContractSpec') {
	outputs.file(contractSpecFile)
	doLast {
		def output = contractSpecFile.get().asFile
		output.parentFile.mkdirs()
			uri("https://raw.githubusercontent.com/wozufia/gestion-compte-contrat/master/gestion-compte-contrat.yml").toURL()
				.withInputStream { input ->
					output.withOutputStream { stream -> stream << input }
				}
	}
}

openApiGenerate {
	inputSpec = contractSpecFile.get().asFile.absolutePath
	outputDir = layout.buildDirectory.dir("generated").get().asFile.absolutePath
	apiPackage = "com.awa.centrale.gestioncompte.api"
	modelPackage = "com.awa.centrale.gestioncompte.dto"
	skipOverwrite = false
	generateModelTests = false
	generateApiTests = false
	generatorName = "spring"
	openapiNormalizer = ['REF_AS_PARENT_IN_ALLOF': 'true']
	configOptions = [
	        'useSpringBoot3': 'true',
			'useTags': 'true',
			'useLombok': 'true'
	]
	importMappings = [
	        'java.time.OffsetDateTime': 'java.time.ZonedDateTime',
	]
	typeMappings = [
	        'OffsetDateTime': 'ZonedDateTime',
	]
	additionalProperties.set([
			interfaceOnly: true,
//			useJakartaEe: "true"
			useBeanValidation: true,
			skipDefaultInterface: true,
			modelNameSuffix: 'Dto',
			generatedConstructorWithRequiredArgs: false,
			additionalModelTypeAnnotations: '@org.springframework.validation.annotation.Validated; @com.fasterxml.jackson.annotation.JsonIgnoreProperties(ignoreUnknown = true); @lombok.Data; @lombok.NoArgsConstructor; @lombok.AllArgsConstructor;'

	])
}

tasks.named('openApiGenerate') {
	dependsOn tasks.named('fetchContractSpec')
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/src/main/java"
		}
	}
}
