plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.5.0'
	id 'maven-publish'
}

repositories {
	mavenCentral()
}

group = 'com.awa.centrale'
version = '0.0.1-SNAPSHOT'
description = 'Outil de gestion des comptes'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/wozufia/gestion-compte")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

}

openApiGenerate {
	inputSpec = "$rootDir/../gestion-compte-contrat/gestion-compte-contrat.yaml"
	outputDir = layout.buildDirectory.dir("generated").get().asFile.absolutePath
	apiPackage = "com.awa.centrale.gestioncompte.api"
	modelPackage = "com.awa.centrale.gestioncompte.model"
//	invokerPackage = "com.awa.centrale.gestioncompte.invoker"
	skipOverwrite = true
	generateModelTests = false
	generateApiTests = false
	generatorName = "spring"
	openapiNormalizer = ['REF_AS_PARENT_IN_ALLOF': 'true']
	configOptions = [
	        'useSpringBoot3': 'true',
			'useTags': 'true'
	]
	importMappings = [
	        'java.time.OffsetDateTime': 'java.time.ZonedDateTime',
	]
	typeMappings = [
	        'OffsetDateTime': 'ZonedDateTime',
	]
	additionalProperties.set([
			interfaceOnly: true,
//			useJakartaEe: "true"
			useBeanValidation: true,
			skipDefaultInterface: true,
			generatedConstructorWithRequiredArgs: false,
			additionalModelTypeAnnotations: '@org.springframework.validation.annotation.Validated; @comfaterxml.jackson.annotation.JsonIgnoreProperties(ignoreUnknown = true); @Lombok.NoArgsConstructor; @Lombok.experimental.SuperBuilder; @lombok.AllArgsConstructor;'

	])
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	main {
		java {
			srcDir "$buildDir/generated/src/main/java"
		}
	}
}
